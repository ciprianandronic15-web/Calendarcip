<!DOCTYPE html>
<html lang="ro">
<head>
    <!-- STREAMING_CHUNK:Configuring document head and styles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Academic Hub - Calendar, Prezențe & Examene cu Sincronizare Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/40 to-violet-50/40 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- STREAMING_CHUNK:Rendering navigation header -->
    <header class="w-full bg-white/85 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-600 text-white p-2.5 rounded-2xl shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Student Academic Hub</h1>
                    <p class="text-xs text-slate-500">Cloud Sync • Calendar • Prezențe • Examene</p>
                </div>
            </div>

            <!-- Tab Switcher -->
            <div class="flex items-center bg-slate-100 p-1.5 rounded-2xl shadow-inner gap-1 flex-wrap justify-center">
                <button onclick="switchTab('calendar')" id="tab-btn-calendar" class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-indigo-600 shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days"></i> Calendar
                </button>
                <button onclick="switchTab('attendance')" id="tab-btn-attendance" class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 text-slate-600 hover:text-indigo-600 flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-user"></i> Prezențe
                </button>
                <button onclick="switchTab('exams')" id="tab-btn-exams" class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 text-slate-600 hover:text-indigo-600 flex items-center gap-2">
                    <i class="fa-solid fa-file-lines"></i> Examene & Deadlines
                </button>
            </div>

            <!-- User Account / Sync Badge -->
            <div class="flex items-center gap-3">
                <button onclick="openAccountModal()" id="account-btn" class="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-2xl text-xs sm:text-sm font-semibold transition flex items-center gap-2 border border-indigo-100 shadow-sm">
                    <span id="sync-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                    <i class="fa-solid fa-user-shield"></i> <span id="account-btn-text">Cont & Cloud Sync</span>
                </button>
            </div>
        </div>
    </header>

    <!-- STREAMING_CHUNK:Rendering main application body -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- ================= TAB 1: CALENDAR ================= -->
        <div id="tab-calendar" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-3 flex flex-col sm:flex-row items-center justify-between bg-white px-6 py-4 rounded-3xl shadow-lg shadow-slate-200/50 border border-slate-100 gap-4">
                <h2 id="current-month-year" class="text-lg font-bold text-slate-800">Octombrie 2026</h2>
                <div class="flex items-center gap-3">
                    <button id="today-btn" class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition duration-200 flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-rotate-left"></i> Astăzi
                    </button>
                    <div class="flex items-center bg-slate-100 rounded-xl p-1 shadow-sm">
                        <button id="prev-month" class="p-2 hover:bg-white rounded-lg text-slate-600 transition duration-200" title="Luna Anterioară">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button id="next-month" class="p-2 hover:bg-white rounded-lg text-slate-600 transition duration-200" title="Luna Următoare">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Calendar Grid -->
            <div class="lg:col-span-2 bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6 flex flex-col">
                <div class="grid grid-cols-7 gap-2 mb-4 text-center">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Lun</div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mar</div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mie</div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Joi</div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Vin</div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sâm</div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Dum</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-2 flex-grow"></div>
            </div>

            <!-- Calendar Sidebar -->
            <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
                        <div>
                            <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">Data Selectată</span>
                            <h3 id="selected-date-title" class="text-base font-bold text-slate-800">Luni, 13 Octombrie 2026</h3>
                        </div>
                        <div class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-semibold" id="event-count-badge">0 evenimente</div>
                    </div>
                    <div class="mb-6">
                        <h4 class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-2">
                            <i class="fa-regular fa-clock text-indigo-500"></i> Evenimente în această zi
                        </h4>
                        <div id="event-list" class="space-y-3 max-h-[200px] overflow-y-auto pr-1"></div>
                    </div>
                </div>

                <!-- Add Event Form -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 mt-4">
                    <h4 class="text-xs font-semibold text-slate-800 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-indigo-600"></i> Adaugă Eveniment
                    </h4>
                    <form id="event-form" class="space-y-3">
                        <div>
                            <input type="text" id="event-title" required placeholder="Titlu eveniment..." 
                                class="w-full px-3.5 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="time" id="event-time" required class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <select id="event-color" class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="bg-indigo-500">Indigo (Curs)</option>
                                <option value="bg-emerald-500">Verde (Seminar)</option>
                                <option value="bg-amber-500">Galben (Examen)</option>
                                <option value="bg-rose-500">Roșu (Urgent)</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition duration-200 shadow-md shadow-indigo-200">
                            Salvează Evenimentul
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ================= TAB 2: ATTENDANCE ================= -->
        <div id="tab-attendance" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Materii</p>
                        <h3 id="stat-total-subjects" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="bg-indigo-50 text-indigo-600 p-4 rounded-2xl text-xl"><i class="fa-solid fa-book-open"></i></div>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rată Praguri Îndeplinite</p>
                        <h3 id="stat-avg-attendance" class="text-2xl font-bold text-emerald-600 mt-1">0%</h3>
                    </div>
                    <div class="bg-emerald-50 text-emerald-600 p-4 rounded-2xl text-xl"><i class="fa-solid fa-chart-pie"></i></div>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sub Prag</p>
                        <h3 id="stat-warnings" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                    </div>
                    <div class="bg-amber-50 text-amber-600 p-4 rounded-2xl text-xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6 h-fit">
                    <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-indigo-600"></i> Adaugă Materie
                    </h3>
                    <form id="subject-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Nume Materie</label>
                            <input type="text" id="subject-name" required placeholder="ex: Inteligență Artificială" 
                                class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Profesor / Titular</label>
                            <input type="text" id="subject-professor" placeholder="ex: Conf. Univ. Dr. Popescu" 
                                class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Prag Minim Prezențe (nr. absolut, ex: 7)</label>
                            <input type="number" id="subject-min-count" min="1" max="30" value="7" required
                                class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition duration-200 shadow-md shadow-indigo-200">
                            Creează Materia
                        </button>
                    </form>
                </div>

                <div class="lg:col-span-2 bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6">
                    <h3 class="text-base font-bold text-slate-800 mb-6">Situația Prezențelor</h3>
                    <div id="subjects-container" class="space-y-6"></div>
                </div>
            </div>
        </div>

        <!-- ================= TAB 3: EXAMS & DEADLINES ================= -->
        <div id="tab-exams" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Examene & Deadlines Active</p>
                        <h3 id="stat-active-exams" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="bg-indigo-50 text-indigo-600 p-4 rounded-2xl text-xl"><i class="fa-solid fa-bullhorn"></i></div>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">În Următoarele 7 Zile</p>
                        <h3 id="stat-urgent-exams" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                    </div>
                    <div class="bg-amber-50 text-amber-600 p-4 rounded-2xl text-xl"><i class="fa-solid fa-hourglass-half"></i></div>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Finalizate</p>
                        <h3 id="stat-completed-exams" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                    </div>
                    <div class="bg-emerald-50 text-emerald-600 p-4 rounded-2xl text-xl"><i class="fa-solid fa-circle-check"></i></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Add Exam Form -->
                <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6 h-fit">
                    <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-indigo-600"></i> Adaugă Examen / Deadline
                    </h3>
                    <form id="exam-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Titlu / Denumire</label>
                            <input type="text" id="exam-title" required placeholder="ex: Proiect Final / Examen Parțial" 
                                class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Materie</label>
                            <select id="exam-subject" required class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Tip</label>
                                <select id="exam-type" class="w-full px-3.5 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="Examen">Examen</option>
                                    <option value="Proiect">Proiect</option>
                                    <option value="Temă">Temă / Referat</option>
                                    <option value="Colocviu">Colocviu</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Pondere Notă (%)</label>
                                <input type="number" id="exam-weight" min="5" max="100" value="40" required
                                    class="w-full px-3.5 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Data limită</label>
                                <input type="date" id="exam-date" required class="w-full px-3.5 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Ora</label>
                                <input type="time" id="exam-time" value="10:00" required class="w-full px-3.5 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition duration-200 shadow-md shadow-indigo-200">
                            Salvează Termenul
                        </button>
                    </form>
                </div>

                <!-- Exams List & Filters -->
                <div class="lg:col-span-2 bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6 flex flex-col">
                    <div class="flex flex-col sm:flex-row items-center justify-between pb-4 border-b border-slate-100 mb-6 gap-3">
                        <h3 class="text-base font-bold text-slate-800">Lista Examene & Deadlines</h3>
                        <div class="flex items-center gap-2">
                            <select id="filter-status" onchange="renderExamsModule()" class="px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                                <option value="all">Toate statusurile</option>
                                <option value="pending">În așteptare</option>
                                <option value="in_progress">În lucru</option>
                                <option value="completed">Finalizate</option>
                            </select>
                        </div>
                    </div>

                    <div id="exams-container" class="space-y-4 flex-grow">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal for adding attendance session -->
    <div id="session-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <h3 class="font-bold text-slate-800 text-base" id="modal-subject-title">Adaugă Ședință</h3>
                <button onclick="closeSessionModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="session-form" class="space-y-4">
                <input type="hidden" id="modal-subject-id">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Data Ședinței</label>
                    <input type="date" id="session-date" required class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Status Prezență</label>
                    <select id="session-status" class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none">
                        <option value="present">Prezent</option>
                        <option value="absent">Absent</option>
                        <option value="excused">Motivat</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeSessionModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-sm">Anulează</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm">Salvează</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Account & Cloud Sync Settings -->
    <div id="account-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-50 text-indigo-600 p-2.5 rounded-2xl"><i class="fa-solid fa-cloud-arrow-up text-lg"></i></div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">Cont & Sincronizare Cloud</h3>
                        <p class="text-xs text-slate-500">Datele tale salvate în siguranță online</p>
                    </div>
                </div>
                <button onclick="closeAccountModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="space-y-4 py-2">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Status Conexiune</span>
                        <span id="modal-conn-status" class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">Se conectează...</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">ID Utilizator (UID)</span>
                        <span id="modal-user-id" class="text-xs font-mono text-slate-700 truncate max-w-[240px]">...</span>
                    </div>
                </div>

                <div class="text-xs text-slate-600 leading-relaxed bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100">
                    <p class="font-semibold text-indigo-900 mb-1"><i class="fa-solid fa-circle-info mr-1"></i> Notă pentru GitHub Pages:</p>
                    Aplicația se sincronizează automat prin Firestore. Pentru a o folosi pe GitHub Pages, datele tale sunt salvate pe contul tău anonim securizat sau poți adăuga configurarea Firebase în cod dacă dorești autentificare Google.
                </div>

                <div class="flex gap-3 pt-2">
                    <button onclick="closeAccountModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-sm transition shadow-md shadow-indigo-200">
                        Închide
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- STREAMING_CHUNK:Initializing Firebase and App logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration setup supporting sandbox & standalone GitHub deployment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'student-academic-hub-default';
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyDummyKeyForGitHubPagesHostingPlaceholder",
            authDomain: "student-academic-hub.firebaseapp.com",
            projectId: "student-academic-hub",
            storageBucket: "student-academic-hub.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;

        let app, auth, db;
        let currentUser = null;
        let isCloudSynced = false;

        // In-memory data states
        window.currentDate = new Date();
        window.selectedDateStr = formatDateKey(new Date());
        window.events = {};
        window.subjects = [];
        window.exams = [];

        const monthsRo = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];
        const daysRo = ["Duminică", "Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă"];

        async function initFirebaseAndApp() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Auth Rule 3: Sign in first
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUser = user;
                        isCloudSynced = true;
                        updateSyncBadge(true, user.uid);
                        loadDataFromCloud();
                    } else {
                        isCloudSynced = false;
                        updateSyncBadge(false, null);
                        loadDataFromLocalStorage();
                    }
                });
            } catch (e) {
                console.warn("Cloud connection fallback to local storage:", e);
                isCloudSynced = false;
                updateSyncBadge(false, null);
                loadDataFromLocalStorage();
            }

            renderCalendar();
            renderAttendanceModule();
            renderExamsModule();
        }

        function updateSyncBadge(synced, uid) {
            const dot = document.getElementById('sync-status-dot');
            const btnText = document.getElementById('account-btn-text');
            const connStatus = document.getElementById('modal-conn-status');
            const modalUid = document.getElementById('modal-user-id');

            if (synced) {
                if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-200";
                if (btnText) btnText.textContent = "Cloud Sincronizat";
                if (connStatus) { connStatus.textContent = "Conectat în Cloud (Online)"; connStatus.className = "text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full"; }
                if (modalUid) modalUid.textContent = uid;
            } else {
                if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
                if (btnText) btnText.textContent = "Mod Local";
                if (connStatus) { connStatus.textContent = "Mod Local (Offline)"; connStatus.className = "text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-full"; }
                if (modalUid) modalUid.textContent = "Nespecificat";
            }
        }

        // Firestore data sync functions adhering to Rule 1 & Rule 2
        async function saveDataToCloud() {
            if (!currentUser || !db) return;
            try {
                const userId = currentUser.uid;
                await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'data', 'academic_payload'), {
                    events: window.events,
                    subjects: window.subjects,
                    exams: window.exams,
                    updatedAt: new Date().toISOString()
                });
            } catch (err) {
                console.error("Error saving data:", err);
            }
        }

        function loadDataFromCloud() {
            if (!currentUser || !db) return;
            const userId = currentUser.uid;
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'data', 'academic_payload');
            
            // Rule: onSnapshot with error callback
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.events = data.events || {};
                    window.subjects = data.subjects || [];
                    window.exams = data.exams || [];
                } else {
                    loadDataFromLocalStorage();
                    saveDataToCloud();
                }
                renderCalendar();
                renderAttendanceModule();
                renderExamsModule();
            }, (error) => {
                console.error("Cloud snapshot error:", error);
                loadDataFromLocalStorage();
            });
        }

        function loadDataFromLocalStorage() {
            window.events = JSON.parse(localStorage.getItem('student_calendar_events')) || {
                '2026-10-15': [{ title: 'Curs IA Avansată', time: '10:00', color: 'bg-indigo-500', desc: 'Sala A102' }]
            };
            window.subjects = JSON.parse(localStorage.getItem('student_subjects')) || [
                {
                    id: 'sub-1', name: 'Inteligență Artificială', professor: 'Conf. Univ. Dr. Ionescu', minCount: 7,
                    sessions: [{ id: 's1', date: '2026-10-01', status: 'present' }, { id: 's2', date: '2026-10-08', status: 'present' }]
                }
            ];
            window.exams = JSON.parse(localStorage.getItem('student_exams')) || [
                {
                    id: 'ex-1', title: 'Proiect Rețele Neurale', subject: 'Inteligență Artificială', type: 'Proiect',
                    weight: 40, date: '2026-10-25', time: '23:59', status: 'in_progress'
                }
            ];
        }

        function persistData() {
            localStorage.setItem('student_calendar_events', JSON.stringify(window.events));
            localStorage.setItem('student_subjects', JSON.stringify(window.subjects));
            localStorage.setItem('student_exams', JSON.stringify(window.exams));
            if (currentUser) {
                saveDataToCloud();
            }
        }

        window.openAccountModal = function() {
            const modal = document.getElementById('account-modal');
            if (modal) modal.classList.remove('hidden');
        }

        window.closeAccountModal = function() {
            const modal = document.getElementById('account-modal');
            if (modal) modal.classList.add('hidden');
        }

        window.switchTab = function(tabName) {
            ['calendar', 'attendance', 'exams'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (el) el.classList.add('hidden');
                if (btn) btn.className = "px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 text-slate-600 hover:text-indigo-600 flex items-center gap-2";
            });
            const activeEl = document.getElementById(`tab-${tabName}`);
            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            if (activeEl) activeEl.classList.remove('hidden');
            if (activeBtn) activeBtn.className = "px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-indigo-600 shadow-sm flex items-center gap-2";

            if (tabName === 'calendar') renderCalendar();
            if (tabName === 'attendance') renderAttendanceModule();
            if (tabName === 'exams') renderExamsModule();
        };

        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-2xl shadow-xl text-white text-sm font-medium flex items-center gap-3 transition-all duration-300 transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ================= CALENDAR MODULE =================
        function renderCalendar() {
            const year = window.currentDate.getFullYear();
            const month = window.currentDate.getMonth();
            const monthYearEl = document.getElementById('current-month-year');
            if (monthYearEl) monthYearEl.textContent = `${monthsRo[month]} ${year}`;

            const grid = document.getElementById('calendar-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();
            const todayStr = formatDateKey(new Date());

            for (let i = adjustedFirstDay - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                const pM = month === 0 ? 11 : month - 1;
                const pY = month === 0 ? year - 1 : year;
                grid.appendChild(createDayCell(dayNum, `${pY}-${String(pM + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`, true));
            }

            for (let i = 1; i <= totalDays; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                grid.appendChild(createDayCell(i, dateStr, false, dateStr === todayStr, dateStr === window.selectedDateStr));
            }

            const totalCellsSoFar = adjustedFirstDay + totalDays;
            const remainingCells = totalCellsSoFar <= 35 ? 35 - totalCellsSoFar : 42 - totalCellsSoFar;
            for (let i = 1; i <= remainingCells; i++) {
                const nM = month === 11 ? 0 : month + 1;
                const nY = month === 11 ? year + 1 : year;
                grid.appendChild(createDayCell(i, `${nY}-${String(nM + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`, true));
            }
            updateSelectedDatePanel();
        }

        function createDayCell(dayNum, dateStr, isMuted = false, isToday = false, isSelected = false) {
            const cell = document.createElement('div');
            cell.className = `min-h-[85px] p-2 rounded-2xl border transition-all duration-200 flex flex-col justify-between cursor-pointer ${isMuted ? 'bg-slate-50/50 border-slate-100 text-slate-400' : 'bg-white border-slate-100 hover:border-indigo-200 hover:shadow-md'} ${isSelected ? 'ring-2 ring-indigo-600 border-indigo-600 bg-indigo-50/30' : ''}`;
            cell.onclick = () => { window.selectedDateStr = dateStr; renderCalendar(); };

            const topDiv = document.createElement('div');
            topDiv.className = 'flex items-center justify-between';
            const span = document.createElement('span');
            span.className = `text-sm font-semibold h-7 w-7 flex items-center justify-center rounded-xl ${isToday ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : isMuted ? 'text-slate-400' : 'text-slate-700'}`;
            span.textContent = dayNum;
            topDiv.appendChild(span);
            cell.appendChild(topDiv);

            const dayEvents = window.events[dateStr] || [];
            if (dayEvents.length > 0) {
                const indicators = document.createElement('div');
                indicators.className = 'space-y-1 mt-1';
                dayEvents.slice(0, 2).forEach(ev => {
                    const badge = document.createElement('div');
                    badge.className = `text-[10px] px-1.5 py-0.5 rounded-md text-white truncate font-medium ${ev.color || 'bg-indigo-500'}`;
                    badge.textContent = `${ev.time} ${ev.title}`;
                    indicators.appendChild(badge);
                });
                cell.appendChild(indicators);
            }
            return cell;
        }

        function updateSelectedDatePanel() {
            const [y, m, d] = window.selectedDateStr.split('-').map(Number);
            const dateTitleEl = document.getElementById('selected-date-title');
            if (dateTitleEl) {
                dateTitleEl.textContent = `${daysRo[new Date(y, m - 1, d).getDay()]}, ${d} ${monthsRo[m - 1]} ${y}`;
            }
            const dayEvents = window.events[window.selectedDateStr] || [];
            const countBadge = document.getElementById('event-count-badge');
            if (countBadge) countBadge.textContent = `${dayEvents.length} evenimente`;
            
            const list = document.getElementById('event-list');
            if (!list) return;
            list.innerHTML = '';
            if (dayEvents.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm"><i class="fa-regular fa-calendar-xmark text-2xl mb-2 text-slate-300"></i><p>Niciun eveniment.</p></div>`;
                return;
            }
            dayEvents.forEach((ev, idx) => {
                const item = document.createElement('div');
                item.className = 'p-3 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between gap-2';
                item.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate">
                        <div class="w-2.5 h-2.5 rounded-full ${ev.color || 'bg-indigo-500'} flex-shrink-0"></div>
                        <div class="truncate">
                            <h5 class="text-xs font-bold text-slate-800 truncate">${ev.title}</h5>
                            <p class="text-[10px] text-slate-500">${ev.time}</p>
                        </div>
                    </div>
                    <button onclick="deleteEvent('${window.selectedDateStr}', ${idx})" class="text-slate-400 hover:text-rose-600 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                `;
                list.appendChild(item);
            });
        }

        window.deleteEvent = function(dateKey, index) {
            if (window.events[dateKey]) {
                window.events[dateKey].splice(index, 1);
                if (window.events[dateKey].length === 0) delete window.events[dateKey];
                persistData();
                renderCalendar();
                showToast("Eveniment șters!");
            }
        };

        // ================= ATTENDANCE MODULE =================
        function renderAttendanceModule() {
            const container = document.getElementById('subjects-container');
            if (!container) return;
            container.innerHTML = '';
            let totalMet = 0, warningCount = 0;

            if (window.subjects.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center py-6 text-sm">Nicio materie adăugată.</p>`;
                document.getElementById('stat-total-subjects').textContent = 0;
                document.getElementById('stat-avg-attendance').textContent = '0%';
                document.getElementById('stat-warnings').textContent = 0;
                return;
            }

            window.subjects.forEach(sub => {
                const attendedCount = sub.sessions.filter(s => s.status === 'present' || s.status === 'excused').length;
                const targetCount = sub.minCount || 7;
                const progressPercent = Math.min(100, Math.round((attendedCount / targetCount) * 100));
                const isCompleted = attendedCount >= targetCount;
                if (isCompleted) totalMet++;
                const isWarning = !isCompleted;
                if (isWarning) warningCount++;

                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl border ${isCompleted ? 'bg-emerald-50/20 border-emerald-100' : 'bg-slate-50/50 border-slate-100'}`;
                
                let sessHtml = `<div class="flex flex-wrap gap-2 mb-3">`;
                sub.sessions.forEach(s => {
                    let col = s.status === 'present' ? 'bg-emerald-100 text-emerald-700' : s.status === 'absent' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700';
                    sessHtml += `<div class="text-xs px-2.5 py-1 rounded-xl border ${col} flex items-center gap-2">${s.date} (${s.status}) <button onclick="deleteSession('${sub.id}', '${s.id}')"><i class="fa-solid fa-xmark"></i></button></div>`;
                });
                sessHtml += `</div>`;

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <div><h4 class="font-bold text-slate-800">${sub.name}</h4><p class="text-xs text-slate-500">${sub.professor || 'Fără titular'} • Necesar: ${targetCount} prezențe</p></div>
                        <div class="flex gap-2">
                            <button onclick="openSessionModal('${sub.id}', '${sub.name}')" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-semibold hover:bg-indigo-100"><i class="fa-solid fa-plus"></i> Ședință</button>
                            <button onclick="deleteSubject('${sub.id}')" class="text-slate-400 hover:text-rose-600 p-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span>Prezențe: ${attendedCount} / ${targetCount} necesare</span>
                            <span class="${isCompleted ? 'text-emerald-600' : 'text-amber-600'}">${isCompleted ? 'Prag îndeplinit! ✅' : 'În curs'}</span>
                        </div>
                        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                            <div class="h-full ${isCompleted ? 'bg-emerald-500' : 'bg-indigo-500'}" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>
                    ${sub.sessions.length > 0 ? sessHtml : '<p class="text-xs text-slate-400 italic mb-3">Nicio ședință înregistrată.</p>'}
                `;
                container.appendChild(card);
            });

            const statTotal = document.getElementById('stat-total-subjects');
            const statAvg = document.getElementById('stat-avg-attendance');
            const statWarn = document.getElementById('stat-warnings');
            if (statTotal) statTotal.textContent = window.subjects.length;
            if (statAvg) statAvg.textContent = `${Math.round((totalMet / window.subjects.length) * 100)}%`;
            if (statWarn) statWarn.textContent = warningCount;
            updateExamSubjectDropdown();
        }

        window.openSessionModal = function(id, name) {
            const modalSubId = document.getElementById('modal-subject-id');
            const modalTitle = document.getElementById('modal-subject-title');
            const sessionDate = document.getElementById('session-date');
            const modal = document.getElementById('session-modal');

            if (modalSubId) modalSubId.value = id;
            if (modalTitle) modalTitle.textContent = `Adaugă Ședință: ${name}`;
            if (sessionDate) sessionDate.value = formatDateKey(new Date());
            if (modal) modal.classList.remove('hidden');
        };

        window.closeSessionModal = function() {
            const modal = document.getElementById('session-modal');
            if (modal) modal.classList.add('hidden');
        };

        window.deleteSubject = function(id) {
            window.subjects = window.subjects.filter(s => s.id !== id);
            persistData();
            renderAttendanceModule();
            showToast("Materie ștersă!");
        };

        window.deleteSession = function(subId, sId) {
            const sub = window.subjects.find(s => s.id === subId);
            if (sub) {
                sub.sessions = sub.sessions.filter(s => s.id !== sId);
                persistData();
                renderAttendanceModule();
                showToast("Ședință ștearsă!");
            }
        };

        // ================= EXAMS MODULE =================
        function updateExamSubjectDropdown() {
            const select = document.getElementById('exam-subject');
            if (!select) return;
            select.innerHTML = '';
            if (window.subjects.length === 0) {
                select.innerHTML = `<option value="">Adaugă mai întâi o materie</option>`;
                return;
            }
            window.subjects.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.name;
                opt.textContent = sub.name;
                select.appendChild(opt);
            });
        }

        function renderExamsModule() {
            const container = document.getElementById('exams-container');
            if (!container) return;
            container.innerHTML = '';
            const statusFilterEl = document.getElementById('filter-status');
            const statusFilter = statusFilterEl ? statusFilterEl.value : 'all';

            let activeCount = 0, urgentCount = 0, completedCount = 0;
            const now = new Date();

            const filtered = window.exams.filter(ex => statusFilter === 'all' || ex.status === statusFilter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm"><i class="fa-solid fa-file-circle-check text-3xl mb-2 text-slate-300"></i><p>Niciun examen sau termen limită găsit.</p></div>`;
            }

            filtered.forEach(ex => {
                if (ex.status !== 'completed') activeCount++;
                else completedCount++;

                const examDate = new Date(`${ex.date}T${ex.time}`);
                const diffTime = examDate - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays >= 0 && diffDays <= 7 && ex.status !== 'completed') urgentCount++;

                let countdownText = '';
                let badgeColor = 'bg-indigo-50 text-indigo-700 border-indigo-200';
                if (ex.status === 'completed') {
                    countdownText = 'Finalizat';
                    badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                } else if (diffDays < 0) {
                    countdownText = 'Expirat';
                    badgeColor = 'bg-rose-50 text-rose-700 border-rose-200';
                } else if (diffDays === 0) {
                    countdownText = 'Astăzi!';
                    badgeColor = 'bg-rose-50 text-rose-700 border-rose-200 font-bold';
                } else {
                    countdownText = `În ${diffDays} ${diffDays === 1 ? 'zi' : 'zile'}`;
                }

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 transition duration-200 ${ex.status === 'completed' ? 'bg-slate-50/50 border-slate-200 opacity-75' : 'bg-white border-slate-100 hover:shadow-md'}`;
                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="p-3 rounded-2xl bg-indigo-50 text-indigo-600 mt-1"><i class="fa-solid fa-file-lines text-lg"></i></div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-slate-800 text-sm sm:text-base">${ex.title}</h4>
                                <span class="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-slate-100 text-slate-600">${ex.type}</span>
                            </div>
                            <p class="text-xs text-slate-500 font-medium mt-0.5">${ex.subject} • Pondere: ${ex.weight}%</p>
                            <p class="text-xs text-slate-400 mt-1"><i class="fa-regular fa-calendar mr-1"></i>${ex.date} la ${ex.time}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                        <span class="text-xs px-3 py-1.5 rounded-xl border ${badgeColor}">${countdownText}</span>
                        <select onchange="updateExamStatus('${ex.id}', this.value)" class="text-xs px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                            <option value="pending" ${ex.status === 'pending' ? 'selected' : ''}>În așteptare</option>
                            <option value="in_progress" ${ex.status === 'in_progress' ? 'selected' : ''}>În lucru</option>
                            <option value="completed" ${ex.status === 'completed' ? 'selected' : ''}>Finalizat</option>
                        </select>
                        <button onclick="deleteExam('${ex.id}')" class="text-slate-400 hover:text-rose-600 p-1.5"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });

            const statActive = document.getElementById('stat-active-exams');
            const statUrgent = document.getElementById('stat-urgent-exams');
            const statCompleted = document.getElementById('stat-completed-exams');
            if (statActive) statActive.textContent = activeCount;
            if (statUrgent) statUrgent.textContent = urgentCount;
            if (statCompleted) statCompleted.textContent = completedCount;
        }

        window.updateExamStatus = function(id, status) {
            const ex = window.exams.find(e => e.id === id);
            if (ex) {
                ex.status = status;
                persistData();
                renderExamsModule();
                showToast("Status actualizat!");
            }
        };

        window.deleteExam = function(id) {
            window.exams = window.exams.filter(e => e.id !== id);
            persistData();
            renderExamsModule();
            showToast("Examen / Deadline șters!");
        };

        // Event Listeners setup on window load
        window.onload = function() {
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const todayBtn = document.getElementById('today-btn');
            const eventForm = document.getElementById('event-form');
            const subjectForm = document.getElementById('subject-form');
            const sessionForm = document.getElementById('session-form');
            const examForm = document.getElementById('exam-form');

            if (prevMonthBtn) prevMonthBtn.addEventListener('click', () => { window.currentDate.setMonth(window.currentDate.getMonth() - 1); renderCalendar(); });
            if (nextMonthBtn) nextMonthBtn.addEventListener('click', () => { window.currentDate.setMonth(window.currentDate.getMonth() + 1); renderCalendar(); });
            if (todayBtn) todayBtn.addEventListener('click', () => { window.currentDate = new Date(); window.selectedDateStr = formatDateKey(new Date()); renderCalendar(); });

            if (eventForm) {
                eventForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = document.getElementById('event-title').value.trim();
                    const time = document.getElementById('event-time').value;
                    const color = document.getElementById('event-color').value;
                    if (!title || !time) return;
                    if (!window.events[window.selectedDateStr]) window.events[window.selectedDateStr] = [];
                    window.events[window.selectedDateStr].push({ title, time, color });
                    persistData();
                    document.getElementById('event-title').value = '';
                    document.getElementById('event-time').value = '';
                    renderCalendar();
                    showToast("Eveniment adăugat!");
                });
            }

            if (subjectForm) {
                subjectForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('subject-name').value.trim();
                    const professor = document.getElementById('subject-professor').value.trim();
                    const minCount = parseInt(document.getElementById('subject-min-count').value);
                    if (!name) return;
                    window.subjects.push({ id: 'sub-' + Date.now(), name, professor, minCount: isNaN(minCount) ? 7 : minCount, sessions: [] });
                    persistData();
                    document.getElementById('subject-name').value = '';
                    document.getElementById('subject-professor').value = '';
                    document.getElementById('subject-min-count').value = '7';
                    renderAttendanceModule();
                    showToast("Materie adăugată!");
                });
            }

            if (sessionForm) {
                sessionForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const subId = document.getElementById('modal-subject-id').value;
                    const date = document.getElementById('session-date-input') || document.getElementById('session-date').value;
                    const status = document.getElementById('session-status').value;
                    const sub = window.subjects.find(s => s.id === subId);
                    if (sub) {
                        sub.sessions.push({ id: 's-' + Date.now(), date: document.getElementById('session-date').value, status });
                        persistData();
                        closeSessionModal();
                        renderAttendanceModule();
                        showToast("Prezență înregistrată!");
                    }
                });
            }

            if (examForm) {
                examForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = document.getElementById('exam-title').value.trim();
                    const subject = document.getElementById('exam-subject').value;
                    const type = document.getElementById('exam-type').value;
                    const weight = parseInt(document.getElementById('exam-weight').value);
                    const date = document.getElementById('exam-date').value;
                    const time = document.getElementById('exam-time').value;

                    if (!title || !subject || !date) return;

                    window.exams.push({
                        id: 'ex-' + Date.now(),
                        title, subject, type,
                        weight: isNaN(weight) ? 40 : weight,
                        date, time,
                        status: 'pending'
                    });

                    persistData();
                    document.getElementById('exam-title').value = '';
                    renderExamsModule();
                    showToast("Examen / Deadline adăugat cu succes!");
                });
            }

            initFirebaseAndApp();
        };
    </script>
</body>
</html>
